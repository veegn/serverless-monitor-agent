name: Release Binaries

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            asset_name: sma-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            asset_name: sma-linux-arm64
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            asset_name: sma-linux-386
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            use_cross: true
            asset_name: sma-linux-armv7
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            asset_name: sma-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            asset_name: sma-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            asset_name: sma-windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            asset_name: sma-windows-arm64.exe
          - target: i686-pc-windows-msvc
            os: windows-latest
            use_cross: false
            asset_name: sma-windows-386.exe
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            use_cross: true
            asset_name: sma-freebsd-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build binary (cross)
        if: matrix.use_cross
        run: |
          cross build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sma dist/${{ matrix.asset_name }}

      - name: Build binary (cargo)
        if: "!matrix.use_cross"
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/sma.exe dist/${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/sma dist/${{ matrix.asset_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
